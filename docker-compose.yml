name: powerscale

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: powerscale
      POSTGRES_USER: powerscale
      POSTGRES_PASSWORD: powerscale
    ports:
      - "5432:5432"
    volumes:
      - powerscale-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerscale -d powerscale"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: powerscale
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        psql -h postgres -U powerscale -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname='powerscale_ranking'" | grep -q 1
        || psql -h postgres -U powerscale -d postgres
        -c "CREATE DATABASE powerscale_ranking OWNER powerscale"
    restart: "no"

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - powerscale-kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - powerscale-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  voting-service:
    build:
      context: .
      dockerfile: docker/voting-service.Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/powerscale
      DB_USERNAME: powerscale
      DB_PASSWORD: powerscale
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      VOTE_TOPIC: vote-submitted
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_UPLOADS_DIR: /app/uploads
    ports:
      - "8081:8081"
    volumes:
      - powerscale-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  ranking-service:
    build:
      context: .
      dockerfile: docker/ranking-service.Dockerfile
    environment:
      RANKING_DB_URL: jdbc:postgresql://postgres:5432/powerscale_ranking
      DB_USERNAME: powerscale
      DB_PASSWORD: powerscale
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      VOTE_TOPIC: vote-submitted
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LEADERBOARD_CACHE_ENABLED: "${LEADERBOARD_CACHE_ENABLED:-true}"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: docker/api-gateway.Dockerfile
    environment:
      VOTING_SERVICE_URL: http://voting-service:8081
      VOTING_SERVICE_URL_2: http://voting-service:8081
      RANKING_SERVICE_URL: http://ranking-service:8082
    ports:
      - "8080:8080"
    depends_on:
      voting-service:
        condition: service_healthy
      ranking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  powerscale-postgres:
  powerscale-kafka:
  powerscale-redis:
  powerscale-uploads:
