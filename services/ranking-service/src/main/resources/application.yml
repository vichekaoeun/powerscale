server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ranking-service
  datasource:
    url: ${RANKING_DB_URL:jdbc:postgresql://localhost:5432/powerscale_ranking}
    username: ${DB_USERNAME:powerscale}
    password: ${DB_PASSWORD:powerscale}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ranking-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  kafka:
    vote-topic: ${VOTE_TOPIC:vote-submitted}
    scale-vote-topic: ${SCALE_VOTE_TOPIC:scale-vote-submitted}
  cache:
    leaderboard-enabled: ${LEADERBOARD_CACHE_ENABLED:true}
    leaderboard-ttl-seconds: ${LEADERBOARD_CACHE_TTL_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
