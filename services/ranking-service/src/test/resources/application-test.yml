spring:
  datasource:
    url: jdbc:h2:mem:ranking;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:19092
    listener:
      auto-startup: false
  data:
    redis:
      host: localhost
      port: 16379

app:
  cache:
    leaderboard-enabled: false
