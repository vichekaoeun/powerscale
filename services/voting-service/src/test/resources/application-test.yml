spring:
  datasource:
    url: jdbc:h2:mem:voting;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:19092

app:
  uploads:
    dir: target/test-uploads
  anilist:
    base-url: http://localhost:9999
  outbox:
    publish-enabled: false
  backfill:
    enabled: false
  cors:
    allowed-origins: http://localhost:5173
