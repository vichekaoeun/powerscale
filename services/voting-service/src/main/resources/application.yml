server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: voting-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/powerscale}
    username: ${DB_USERNAME:powerscale}
    password: ${DB_PASSWORD:powerscale}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  uploads:
    dir: ${APP_UPLOADS_DIR:./uploads}
  anilist:
    base-url: ${ANILIST_BASE_URL:https://graphql.anilist.co}
  kafka:
    vote-topic: ${VOTE_TOPIC:vote-submitted}
    scale-vote-topic: ${SCALE_VOTE_TOPIC:scale-vote-submitted}
  outbox:
    publish-enabled: ${OUTBOX_PUBLISH_ENABLED:true}
    interval-ms: ${OUTBOX_INTERVAL_MS:500}
  backfill:
    enabled: ${VOTE_BACKFILL_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
