server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: voting-service
          uri: lb://voting-service
          predicates:
            - Path=/api/characters/**,/api/matchups/**,/api/votes/**,/api/scales/**,/api/uploads/**
          filters:
            - name: CircuitBreaker
              args:
                name: votingService
                fallbackUri: forward:/fallback/voting
        - id: ranking-service
          uri: ${RANKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/leaderboard/**,/api/scale-leaderboard/**,/api/rankings/**
          filters:
            - name: CircuitBreaker
              args:
                name: rankingService
                fallbackUri: forward:/fallback/ranking
    discovery:
      client:
        simple:
          instances:
            voting-service:
              - uri: ${VOTING_SERVICE_URL:http://localhost:8081}
              - uri: ${VOTING_SERVICE_URL_2:http://localhost:8081}

resilience4j:
  timelimiter:
    instances:
      votingService:
        timeout-duration: 30s
      rankingService:
        timeout-duration: 10s
  circuitbreaker:
    instances:
      votingService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
      rankingService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info
